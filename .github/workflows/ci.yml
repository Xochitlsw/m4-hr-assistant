# Pipeline del HR Assistant (ADR 0012 y 0015). Vive en la raíz porque GitHub solo lee
# .github/workflows/ ahí; el producto está en product/ (working-directory por omisión).
#   style -> unit -> e2e -> docker   el producto, encadenado con needs
#   factory                          las verificaciones de la fábrica que juzgan cada
#                                    entrega (la capa 1 del sistema)
#   security                         pip-audit de los locks y gitleaks del historial
# Render publica solo si todos pasan (autoDeployTrigger: checksPass).
# Cada acción va fijada al SHA de su commit; el comentario dice la versión.
# Las dependencias se instalan de locks con hashes (product/requirements*.txt).
# La clave de e2e y de la imagen es un texto de ejemplo, visible a propósito: no es un
# secreto y no sirve en ningún otro lugar.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: product

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  EXAMPLE_KEY: ci-example-key-0123456789

jobs:
  style:
    name: style (pylint, 88 columnas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements-dev.txt
      - name: Instalar dependencias de desarrollo (lock con hashes)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Pylint
        run: >-
          python -m pylint app tests --max-line-length=88
          --disable=missing-function-docstring
          --disable=redefined-outer-name,too-few-public-methods

  unit:
    name: unit (pruebas y BDD, cobertura >= 80 %)
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements-dev.txt
      - name: Instalar dependencias de desarrollo (lock con hashes)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Pruebas con cobertura
        run: python -m pytest tests -q -p no:cacheprovider --cov=app --cov-fail-under=80

  e2e:
    name: e2e (Playwright con el modelo simulado)
    needs: unit
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements-dev.txt
      - name: Instalar dependencias de desarrollo (lock con hashes)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Arrancar el producto
        run: |
          API_KEYS="ci:${EXAMPLE_KEY}" python -m uvicorn app.main:app --port 8000 \
            --no-access-log > server.log 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 0.5
          done
          cat server.log
          exit 1
      - name: Pruebas de punta a punta
        run: >-
          E2E_API_KEY="${EXAMPLE_KEY}"
          python -m pytest e2e -q -p no:cacheprovider --base-url http://127.0.0.1:8000

  docker:
    name: docker (construir y probar la imagen)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Construir la imagen
        run: docker build -t m4-hr-assistant:ci .
      - name: La imagen no corre como root ni trae herramientas de desarrollo
        run: |
          test "$(docker run --rm m4-hr-assistant:ci id -u)" = "10001"
          if docker run --rm m4-hr-assistant:ci python -c "import pytest"; then
            echo "pytest no debe estar en la imagen"; exit 1
          fi
      - name: Arrancar la imagen y esperar su HEALTHCHECK
        run: |
          docker run -d --name hr -p 8000:8000 \
            -e MODEL_PROVIDER=fake -e API_KEYS="ci:${EXAMPLE_KEY}" m4-hr-assistant:ci
          for attempt in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' hr)"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs hr
          exit 1
      - name: Prueba de humo contra la imagen
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
          SMOKE_API_KEY="${EXAMPLE_KEY}" python scripts/smoke.py http://127.0.0.1:8000
      - name: Log del contenedor (solo JSON del producto)
        if: always()
        run: docker logs hr || true

  factory:
    name: factory (verificaciones de la fábrica)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements-dev.txt
      - name: Instalar dependencias (el lock de desarrollo cubre las de la fábrica)
        run: python -m pip install --require-hashes --no-deps -r product/requirements-dev.txt
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: QA de la propia fábrica
        run: python scripts/verify.py
      - name: verification unit
        run: python -m verification unit
      - name: verification contract
        run: python -m verification contract
      - name: verification qa
        run: python -m verification qa
      - name: verification e2e
        run: python -m verification e2e
      - name: verification evaluate
        run: python -m verification evaluate

  security:
    name: security (pip-audit y gitleaks)
    runs-on: ubuntu-latest
    # gitleaks lee los commits del pull request: solo lectura, y solo en este trabajo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/requirements-dev.txt
      - name: Instalar dependencias de desarrollo (lock con hashes)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Vulnerabilidades conocidas en los locks
        run: >-
          python -m pip_audit --require-hashes --disable-pip --progress-spinner off
          -r requirements.txt -r requirements-dev.txt
      - name: Secretos en todo el historial
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
