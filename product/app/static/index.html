<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Assistant</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --accent: #1d4ed8;
      --user: #e0e7ff;
      --assistant: #eef2f6;
      --error: #b42318;
      --border: #d5dbe3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }
    .conversation {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      min-height: 320px;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message p { margin: 0; }
    .message.user { align-self: flex-end; background: var(--user); }
    .message.assistant { align-self: flex-start; background: var(--assistant); }
    .message.error { align-self: flex-start; color: var(--error); background: #fdecea; }
    .meta { margin-top: 6px !important; font-size: 0.85rem; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row label { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HR Assistant</h1>
      <p class="subtitle">Pregunta por un empleado (EMP-0001) o por un departamento.</p>
    </header>
    <div class="key-row">
      <label for="api-key">Clave de acceso</label>
      <input id="api-key" data-testid="api-key" type="password" autocomplete="off"
             placeholder="La clave que te dio el equipo de soporte">
    </div>
    <section class="conversation" data-testid="answer" aria-live="polite"
             aria-label="Conversación"></section>
    <form id="ask-form">
      <input data-testid="question" name="question" autocomplete="off"
             placeholder="Por ejemplo: ¿Quién es EMP-0004?" aria-label="Pregunta">
      <button data-testid="send" type="submit">Enviar</button>
    </form>
  </main>
  <script>
    "use strict";
    // El historial vive solo en el navegador: la API no guarda nada.
    // Todo el texto se pinta con textContent, para que una respuesta no inyecte código.
    // La clave solo vive en sessionStorage (se borra al cerrar la pestaña) y viaja en
    // el encabezado X-API-Key; nunca se escribe en el código de la página.
    const KEY_STORAGE = "hr-assistant.api-key";
    const history = [];
    const form = document.getElementById("ask-form");
    const question = document.querySelector('[data-testid="question"]');
    const send = document.querySelector('[data-testid="send"]');
    const conversation = document.querySelector('[data-testid="answer"]');
    const apiKey = document.querySelector('[data-testid="api-key"]');

    function readStoredKey() {
      try {
        return sessionStorage.getItem(KEY_STORAGE) || "";
      } catch (error) {
        return "";
      }
    }

    function storeKey(value) {
      try {
        sessionStorage.setItem(KEY_STORAGE, value);
      } catch (error) {
        // Sin sessionStorage la clave solo dura mientras la página está abierta.
      }
    }

    apiKey.value = readStoredKey();
    apiKey.addEventListener("change", () => storeKey(apiKey.value.trim()));

    function addLine(item, className, text) {
      const line = document.createElement("p");
      line.className = className;
      line.textContent = text;
      item.appendChild(line);
    }

    // supportId es el request_id de la respuesta: con él, soporte encuentra la
    // petición en el log y en las trazas.
    function addMessage(kind, text, tools, supportId) {
      const item = document.createElement("div");
      item.className = "message " + kind;
      addLine(item, "text", text);
      if (Array.isArray(tools)) {
        addLine(item, "meta", tools.length
          ? "Herramientas usadas: " + tools.join(", ")
          : "Sin herramientas");
      }
      if (supportId) {
        addLine(item, "meta", "Id de soporte: " + supportId);
      }
      conversation.appendChild(item);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function errorText(status, retryAfter) {
      if (status === 401) {
        return "Clave inválida. Revisa la clave de acceso.";
      }
      if (status === 429) {
        return "Demasiadas preguntas; espera " + (retryAfter || "unos") + " segundos.";
      }
      if (status === 422) {
        return "La pregunta está vacía o es demasiado larga. "
          + "Revísala e intenta de nuevo.";
      }
      return "No pude obtener una respuesta. Intenta de nuevo en un momento.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text) {
        addMessage("error", "Escribe una pregunta antes de enviar.");
        return;
      }
      addMessage("user", text);
      question.value = "";
      send.disabled = true;
      const key = apiKey.value.trim();
      storeKey(key);
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": key },
          body: JSON.stringify({ question: text, history: history }),
        });
        if (!response.ok) {
          const supportId = response.headers.get("X-Request-ID");
          const retryAfter = response.headers.get("Retry-After");
          const message = errorText(response.status, retryAfter);
          addMessage("error", message, null, supportId);
          return;
        }
        const data = await response.json();
        addMessage("assistant", data.answer, data.tools_used, data.request_id);
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.answer });
      } catch (error) {
        addMessage("error", errorText(0));
      } finally {
        send.disabled = false;
        question.focus();
      }
    });
  </script>
</body>
</html>
