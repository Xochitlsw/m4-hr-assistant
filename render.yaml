# Blueprint de Render para el HR Assistant (ADR 0012 y 0015).
# Vive en la raíz del repositorio, donde Render lo busca; el producto está en product/
# (rootDir). Con rootDir, dockerfilePath y dockerContext son relativos a product/ y
# por omisión valen ./Dockerfile y product/, así que no se escriben.
# El servicio se llama igual que el repositorio, para no actualizar por error un
# servicio que ya exista en la cuenta. Render publica solo si todos los trabajos del CI
# pasan (autoDeployTrigger: checksPass). Los secretos llevan sync: false: se escriben en
# Render > Environment, nunca en este archivo. LANGSMITH_API_KEY no va aquí: se agrega
# en Render > Environment si se encienden las trazas.
services:
  - type: web
    name: m4-hr-assistant
    runtime: docker
    rootDir: product
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      # Palancas de costo activas (ADR 0007, 0008 y 0022). Son los valores por omisión
      # del producto, escritos aquí para que producción no dependa de ellos: enrutamiento
      # por regla, ventana de 6 mensajes, tope de salida y presupuesto diario por
      # cliente. La caché del gateway guarda 5 minutos (compliance: 15 como máximo).
      - key: ROUTING
        value: "true"
      - key: HISTORY_WINDOW
        value: "6"
      - key: MODEL_MAX_TOKENS
        value: "300"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CLIENT_DAILY_BUDGET_USD
        value: "1.0"
      # Un proxy de Render delante de la app: el origen es el último valor de
      # X-Forwarded-For (ADR 0017).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Separación de entornos: las trazas de producción van a su propio proyecto.
      - key: LANGSMITH_PROJECT
        value: m4-hr-assistant-prod
      # Trazas encendidas: empiezan en cuanto exista LANGSMITH_API_KEY (se agrega a mano en
      # Render > Environment, tipo Tracing Only); sin ella el producto no se conecta.
      - key: LANGSMITH_TRACING
        value: "true"
      # Trazas redactadas (ADR 0014): si se encienden, LangSmith recibe el texto con los
      # datos personales y los secretos reemplazados por [REDACTED:TIPO].
      - key: HIDE_INPUTS
        value: redact
      - key: HIDE_OUTPUTS
        value: redact
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
